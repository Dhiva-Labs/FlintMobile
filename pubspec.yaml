name: flint
description: "Flint — fast, private mobile browser by Dhiva Labs"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/adblock/
    - assets/reader/
